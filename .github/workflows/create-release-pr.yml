name: Create Release PR

on:
  workflow_dispatch:
    inputs:
      major:
        description: "Major release line"
        required: true
        default: "0"
      draft:
        description: "Create PR as draft"
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  create-release-pr:
    name: Create incremental release PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Fetch remote branches
        run: git fetch origin --prune

      - name: Validate release PR state
        id: validate
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: "open",
              base: "master",
              per_page: 100,
            });

            const openReleasePr = pulls.find((pull) =>
              pull.head.ref.startsWith("release/")
            );

            if (openReleasePr) {
              core.setFailed(
                `An open release PR already exists: ${openReleasePr.html_url}`
              );
            }

      - name: Calculate next release branch
        id: release
        shell: bash
        env:
          RELEASE_MAJOR: ${{ inputs.major }}
        run: |
          set -euo pipefail

          pattern="^origin/release/${RELEASE_MAJOR}\.([0-9]+)$"
          max_minor=0

          while IFS= read -r ref; do
            if [[ "$ref" =~ $pattern ]]; then
              minor="${BASH_REMATCH[1]}"
              if (( minor > max_minor )); then
                max_minor="$minor"
              fi
            fi
          done < <(git branch -r --format='%(refname:short)')

          next_minor=$((max_minor + 1))
          release_branch="release/${RELEASE_MAJOR}.${next_minor}"

          echo "branch=$release_branch" >> "$GITHUB_OUTPUT"
          echo "Next release branch: $release_branch"

      - name: Create and push release branch
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
        run: |
          git switch --create "$RELEASE_BRANCH" origin/develop
          git push --set-upstream origin "$RELEASE_BRANCH"

      - name: Open release PR
        uses: actions/github-script@v7
        env:
          RELEASE_BRANCH: ${{ steps.release.outputs.branch }}
          DRAFT_PR: ${{ inputs.draft }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const releaseBranch = process.env.RELEASE_BRANCH;
            const draft = process.env.DRAFT_PR === "true";

            const response = await github.rest.pulls.create({
              owner,
              repo,
              title: `release: ${releaseBranch.replace("release/", "")}`,
              head: releaseBranch,
              base: "master",
              draft,
              body: [
                "## Summary",
                "- release branch created automatically from `develop`",
                `- branch: \`${releaseBranch}\``,
                "",
                "## Notes",
                "- this PR was generated by the `Create Release PR` workflow",
              ].join("\n"),
            });

            core.notice(`Release PR created: ${response.data.html_url}`);
