name: .NET CI

on:
  pull_request:
    branches:
      - develop
      - master
  push:
    branches:
      - develop
      - master

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AbyssRpg.slnx

      - name: Build
        run: dotnet build AbyssRpg.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test AbyssRpg.slnx --no-build --configuration Release
